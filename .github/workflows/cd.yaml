name: Build and deploy

on:
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  INFRA_CLUSTER_NAME: aks-infra-fint-2021-12-27
  INFRA_CLUSTER_RESOURCE_GROUP: rg-aks-infra

jobs:
  build-and-push-image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Log in to the Container registry
        uses: docker/login-action@v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,enable=true,priority=100,prefix=sha-,suffix=,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      ## Infra cluster ##
      - name: Bake infra manifests with Kustomize
        uses: azure/k8s-bake@v4.1.1
        with:
          renderEngine: 'kustomize'
          kustomizationPath: 'kustomize/base'
        id: bake-infra

      - name: Log in to Azure
        uses: azure/login@v3.1.0
        with:
          creds: '${{ secrets.AKS_INFRA_FINT_GITHUB }}'

      - name: Set the target Infra cluster.
        uses: azure/aks-set-context@v5.0.1
        with:
          cluster-name: ${{ env.INFRA_CLUSTER_NAME }}
          resource-group: ${{ env.INFRA_CLUSTER_RESOURCE_GROUP }}
          admin: 'true'
          use-kubelogin: 'true'

      - name: Deploy to Infra
        uses: azure/k8s-deploy@v7.0.1
        with:
          manifests: ${{ steps.bake-infra.outputs.manifestsBundle }}
          images: |
            ${{ steps.meta.outputs.tags }}
          namespace: default
          action: deploy
          pull-images: 'false'

